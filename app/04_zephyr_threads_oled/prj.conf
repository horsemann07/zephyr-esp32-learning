# ============================================================================
# File        : prj.conf
# Description : Zephyr multithreading with SSD1306 OLED
# Board       : Heltec WiFi LoRa 32 V2
# ============================================================================

# ---------------------------------------------------------------------------
# GPIO and I2C
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y

# ---------------------------------------------------------------------------
# SSD1306 display driver
# ---------------------------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# ---------------------------------------------------------------------------
# Character Framebuffer and Fonts
# ---------------------------------------------------------------------------
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# Memory required by the CFB implementation
CONFIG_HEAP_MEM_POOL_SIZE=2048

# ---------------------------------------------------------------------------
# Zephyr Kernel / Threading
# ---------------------------------------------------------------------------
CONFIG_MULTITHREADING=y

# Static thread stacks are created with K_THREAD_STACK_DEFINE().
# No CONFIG_DYNAMIC_THREAD_ALLOC is required.

# ---------------------------------------------------------------------------
# UART Console
# ---------------------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3