# GPIO and I2C
CONFIG_GPIO=y
CONFIG_I2C=y

# SSD1306 display
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# Character framebuffer and fonts
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# Heap for 128x64 monochrome framebuffer (1024 bytes)
CONFIG_HEAP_MEM_POOL_SIZE=2048

# UART console
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Useful driver error logs
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3