# GPIO/ADC for KY-023 and PRG
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_MULTITHREADING=y

# On-board SSD1306 OLED and procedural drawings
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# UART terminal (COM13)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
